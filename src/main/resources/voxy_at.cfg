# Voxy access transformer.
#
# This replaces upstream Voxy's src/main/resources/voxy.accesswidener. Several entries in that
# file have no 1.12.2 counterpart at all -- everything under com.mojang.blaze3d is part of the
# modern render abstraction, which 1.12.2 predates entirely, and SpriteContents/MipmapStrategy
# did not exist yet either.
#
# Entries are added as each module is ported, rather than up front, because RetroFuturaGradle
# applies this file against the SRG-named jar and a wrong srg name fails the build in a way that
# is annoying to attribute. Resolve names against build/rfg once setupDecompWorkspace has run.
#
# Upstream accesswidener entry                                  1.12.2 target
# ------------------------------------------------------------  --------------------------------
# ClientChunkCache$Storage (class, getChunk, getIndex)           ChunkProviderClient
# PalettedContainer.data / Data.palette / Data.storage           BlockStateContainer
# TextureAtlas.maxMipLevel                                       TextureMap.mipmapLevels
# StairBlock.baseState                                           BlockStairs.modelState
# MultiPlayerGameMode.connection                                 PlayerControllerMP.connection
# BossHealthOverlay.events                                       GuiBossOverlay.mapBossInfos
# GlBuffer.handle / GlRenderPass / GlCommandEncoder              no counterpart (immediate mode)
# SpriteContents.mipmapStrategy                                  no counterpart
