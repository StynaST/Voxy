# Gradle Properties
org.gradle.jvmargs = -Xmx4G
org.gradle.parallel = true
org.gradle.caching = true
# Gradle itself must run on Java 25: CurseForgeGradle now requires a JVM >= 25, and our compile
# tasks provision a Java 25 compiler. Change this path if your JDK 25 lives somewhere else.
org.gradle.java.home = /usr/lib/jvm/java-25-openjdk

# Source Options
# Voxy targets Java 25 to match Cleanroom Loader 0.6.6-alpha, which runs on a Java 25 JVM.
# Jabel is deliberately NOT used: upstream Voxy already uses records, text blocks, pattern
# instanceof and arrow switch, and Cleanroom can load real Java 25 bytecode directly.
use_modern_java_syntax = false
java_version = 25
# Minecraft itself is still decompiled/recompiled at 8 by RetroFuturaGradle; only our sources move to 25.
minecraft_java_version = 8
use_jetbrains_annotations = true

# Compilation Options
generate_sources_jar = false
generate_javadocs_jar = false

# Testing
enable_junit_testing = false
show_testing_output = false

# Mod Information
mod_version = 0.2.19-beta
root_package = me.cortex
mod_id = voxy
mod_name = Voxy

# Mod Metadata (Optional)
mod_description = Far distance rendering mod utilising LoDs
mod_url =
mod_update_json =
mod_authors = Cortex
mod_credits = Celeritas / Embeddium for the 1.12.2 terrain renderer
mod_logo_path = /assets/voxy/icon.png

# Mapping Properties
mapping_channel = stable
mapping_version = 39
use_dependency_at_files = true

# Run Configurations
minecraft_username = Developer
# Voxy allocates large off-heap arenas for its LOD storage, and LWJGL 3 needs native access.
extra_jvm_args = -Xmx6G --enable-native-access=ALL-UNNAMED
extra_tweak_classes =

# Maven Publishing (Provide secret: MAVEN_USER, MAVEN_PASS)
publish_to_maven = false
publish_to_local_maven = false
maven_name = ${mod_name}
maven_url =

# Publishing
release_type = beta
publish_with_changelog = false
client_side = true
server_side = true

# Publishing to CurseForge (Provide secret: CURSEFORGE_TOKEN)
publish_to_curseforge = false
curseforge_project_id =
curseforge_debug = false

# Publishing to Modrinth (Provide secret: MODRINTH_TOKEN)
publish_to_modrinth = false
modrinth_project_id =
modrinth_sync_readme = false
modrinth_debug = false

# If any properties changes below this line, refresh gradle again to ensure everything is working correctly.

# Modify Minecraft Sources
change_minecraft_sources = false

# Tags
use_tags = true
tag_class_name = ${root_package}.${mod_id}.Tags

# Access Transformers
# Replaces upstream Voxy's voxy.accesswidener. See src/main/resources/voxy_at.cfg.
use_access_transformer = true
access_transformer_locations = ${mod_id}_at.cfg

# Mixins
# Two configs, because a mixin config allows only one package root and Voxy splits its mixins
# across me.cortex.voxy.client.mixin and me.cortex.voxy.commonImpl.mixin.
use_mixins = true
mixin_booter_version = 10.7
generate_mixins_json = false
mixin_configs = voxy voxycommon
mixin_refmap = mixins.${mod_id}.refmap.json

# Coremods
is_coremod = true
coremod_includes_mod = true
coremod_plugin_class_name = me.cortex.voxy.VoxyCoreMod

# AssetMover
use_asset_mover = false
asset_mover_version = 2.5

# --- Dependency versions -----------------------------------------------------

# Must match Cleanroom's bundled LWJGL exactly. Cleanroom/gradle.properties has lwjgl_version=3.4.1;
# a mismatch against the loader's org.lwjgl.system core breaks natives at runtime.
lwjgl_version = 3.4.1
# Cleanroom ships lwjgl, lwjgl-glfw, lwjgl-jemalloc, lwjgl-openal, lwjgl-opengl, lwjgl-stb and
# lwjgl-tinyfd -- but NOT lmdb or zstd, which Voxy needs. Those two get shaded in below.
joml_version = 1.10.5

# Storage backends and compressors, all shaded into the output jar.
rocksdb_version = 10.2.1
jedis_version = 5.1.0
commons_pool_version = 2.12.0
lz4_version = 1.8.0
xz_version = 1.10
sqlite_version = 3.49.1.0
